<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">B&amp;M Auto Detailing Logo Concept 01</title>
  <desc id="desc">Premium rectangular monogram and wordmark for B&amp;M Auto Detailing.</desc>
  <rect width="1600" height="1000" fill="#080a0c"/>
  <g transform="translate(170 220)">
    <rect x="0" y="0" width="360" height="360" fill="#101417" stroke="#b99562" stroke-width="10"/>
    <rect x="36" y="36" width="288" height="288" fill="none" stroke="#2b343c" stroke-width="3"/>
    <text x="180" y="208" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="1" fill="#f4f1eb">B&amp;M</text>
    <line x1="90" y1="242" x2="270" y2="242" stroke="#b99562" stroke-width="10"/>
    <text x="180" y="300" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="5" fill="#a7adb1">CALGARY</text>
  </g>
  <g transform="translate(610 292)">
    <text x="0" y="0" font-family="Manrope, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="2" fill="#f4f1eb">B&amp;M</text>
    <text x="0" y="100" font-family="Manrope, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="8" fill="#f4f1eb">AUTO DETAILING</text>
    <line x1="0" y1="145" x2="520" y2="145" stroke="#b99562" stroke-width="10"/>
    <text x="0" y="215" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="6" fill="#a7adb1">CALGARY VEHICLE PROTECTION STUDIO</text>
  </g>
</svg>
